name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      # Keep warning-denied checks on the locally validated toolchain.
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.96.0
      - run: npm run check:rust
      - name: Check connection and session cleanup
        run: node scripts/memory-churn.cjs
        env:
          RUST_SERVER_BINARY: target/debug/no-logic-game-server${{ runner.os == 'Windows' && '.exe' || '' }}
          CHURN_CYCLES: '3'
          CHURN_CLIENTS: '16'
          CHURN_STATE_BYTES: '65536'
          CHURN_OUTPUT: test-results/ci-memory.json
